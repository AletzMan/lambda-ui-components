name: Deploy Docs

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Cambiado a --no-frozen-lockfile para evitar el exit code 2
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 1. Compila la librería primero para generar /dist
      - name: Build Library
        run: pnpm --filter lambda-ui-components build

      # 2. Compila la app de documentación leyendo el /dist recién generado
      - name: Build Next.js Docs
        run: pnpm --filter docs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4